name: anisearch
description: A modern anime search engine application using Flutter and Jikan API.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
